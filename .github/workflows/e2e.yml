name: E2E

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        env:
          DOCKER_BUILDKIT: "1"
        run: go test ./internal/e2elive/ -count=1 -v
