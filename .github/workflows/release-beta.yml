name: Release Beta

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Commit on main to release, versioned by the open release-please PR
        required: false
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: beta
  cancel-in-progress: false

jobs:
  release-beta:
    name: release-beta
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub Token
        uses: actions/create-github-app-token@v3
        id: gh-token
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Create Beta Release
        env:
          GH_TOKEN: ${{ steps.gh-token.outputs.token }}
        run: |
          title=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "autorelease: pending" --json title --jq '.[].title')
          [ "$(printf '%s\n' "$title" | grep -c .)" = 1 ] || { echo "need exactly one open release-please PR, found: $title" >&2; exit 1; }
          version=$(printf '%s' "$title" | sed -nE 's/^chore: release ([0-9]+\.[0-9]+\.[0-9]+)$/\1/p')
          [ -n "$version" ] || { echo "cannot read a version from: $title" >&2; exit 1; }
          tags=$(git ls-remote --tags --refs origin "refs/tags/${version}-beta.*")
          last=$(printf '%s\n' "$tags" | sed -nE "s|.*refs/tags/${version//./\\.}-beta\.([0-9]+)\$|\1|p" | sort -n | tail -n1)
          tag="${version}-beta.$(( ${last:-0} + 1 ))"
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$(git rev-parse HEAD)" --title "$tag" --prerelease --generate-notes
          gh workflow run --repo "$GITHUB_REPOSITORY" publish.yml -f tag="$tag"
