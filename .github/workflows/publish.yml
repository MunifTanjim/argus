name: Publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Git tag
        required: true
        type: string

jobs:
  publish:
    name: publish
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-latest
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          TAG_NAME: ${{ inputs.tag }}
          PUSHPORT_APP_ID: ${{ secrets.PUSHPORT_APP_ID }}
        run: |
          mkdir -p build
          asset=argus-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}
          go build -trimpath -ldflags "-s -w -X main.version=${TAG_NAME} -X main.pushPortAppID=${PUSHPORT_APP_ID}" -o build/${asset} ./cmd/argus
          cd build
          if command -v sha256sum >/dev/null; then
            sha256sum "${asset}" > "${asset}.sha256"
          else
            shasum -a 256 "${asset}" > "${asset}.sha256"
          fi
      - name: Upload Release Asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          asset=build/argus-${TAG_NAME}-${{ matrix.goos }}-${{ matrix.goarch }}
          gh release upload "${TAG_NAME}" "${asset}" "${asset}.sha256" --clobber
